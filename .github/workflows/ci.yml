name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same ref makes the in-flight run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · test · build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # pnpm version comes from the root package.json "packageManager" field.
      - name: Enable corepack
        run: corepack enable

      # Ask pnpm where its store is rather than guessing — the path is
      # version-dependent, and a wrong one caches nothing, silently.
      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "dir=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache the pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # tokens.css is generated from tokens.ts. Hand-editing the CSS, or editing
      # the TS and forgetting to regenerate, silently forks the design system —
      # which is the exact failure the generator exists to prevent.
      - name: Tokens — tokens.css is in sync with tokens.ts
        run: pnpm tokens:check

      # Every semantic colour pair must clear its WCAG threshold. A token that
      # fails here is a bug in tokens.ts, not something a screen works around.
      - name: Tokens — WCAG contrast audit
        run: pnpm tokens:contrast

      # The app once carried 358 hard-coded colours against 16 variables, which
      # is how a design system dies. Now there are none, and a new one fails
      # here. `pnpm tokens:audit` prints the nearest token for each offender.
      - name: Tokens — no hard-coded colour literals
        run: pnpm tokens:literals

      # backend/ has no typechecker. A parse check is a cheap floor: it catches
      # the syntax error that would otherwise only surface when a route is hit.
      - name: Parse-check backend sources
        run: find backend -name '*.js' -not -path '*/node_modules/*' -print0 | xargs -0 -n1 node --check

      - name: Test — packages/lib (domain logic) + apps/web (components)
        run: pnpm test

      # backend/ is CommonJS and deliberately outside the pnpm workspace, so it gets
      # its own install. It used to need none — the tests were pure functions. The
      # ROUTE tests mount the real Express routers, so express/bcryptjs/qrcode have
      # to be here. They still need NO database: the supabase client is replaced by
      # a fake (backend/test/helpers/fakeSupabase.js), which is the only way to make
      # a query fail on demand — and a query failing on demand is the entire bug
      # class these tests exist to prevent.
      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Test — backend (routes + pure logic)
        run: node --test backend/test/

      # Replays backend/db/migrations/ and diffs the result against the
      # committed schema.json. Needs no database and no backend deps. A column
      # that reaches the database without a migration — or a migration nobody
      # snapshotted — fails here rather than the next time someone rebuilds.
      - name: Schema — migrations reproduce schema.json
        run: node backend/db/check-schema.js --offline

      # supabase-js never throws — it resolves to { data, error }. A query that
      # fails returns data: null with an error nobody reads, and the route carries
      # on with nothing and answers as though all were well. That is how
      # /products/:id served an empty list for months, and how the payout run was
      # one failed read away from paying every farmer twice. Static analysis, no
      # database, so it gates here.
      - name: Reads — every supabase call reads its error
        run: node backend/db/check-reads.js

      - name: Build the React app
        run: pnpm build

      # apps/web/dist is gitignored and Express serves /app straight from it.
      # A deploy that skips the build 404s on /app while the legacy site keeps
      # serving, so the failure is silent. Fail loudly here instead.
      - name: Verify /app bundle was produced
        run: test -f apps/web/dist/index.html

      # The public marketplace (Next.js). It builds with NO backend reachable —
      # every server-side read degrades to an empty value rather than throwing, so
      # a slow database can never fail the build (or, in production, blank the
      # marketing page). CI has no API, which makes this a real test of that.
      - name: Build the shop (Next.js)
        run: pnpm build:shop

      # Tailwind does not error on a class it cannot resolve — it emits nothing.
      # `duration-base` reads exactly like `duration-200` and compiles to no CSS,
      # because --duration-* is not a theme namespace. A passing build, typecheck
      # and test suite all miss it. Needs the build above, so it runs last.
      - name: UI — every Tailwind class resolves to CSS
        run: pnpm ui:classes

      # E2E smoke: Playwright drives the built SPA (served by vite preview) with the
      # /api layer mocked, so it needs no backend or database. Browser + its OS libs
      # are installed here; the webServer in playwright.config rebuilds and serves.
      - name: Install Playwright browser (chromium)
        run: pnpm --filter @marutham/web exec playwright install --with-deps chromium

      - name: E2E — web smoke (Playwright, mocked API)
        run: pnpm --filter @marutham/web exec playwright test
