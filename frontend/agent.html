<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Marutham Agrolink — Delivery Agent</title>
<link rel="stylesheet" href="css/app.css">
<style>
.agent-bg{min-height:100vh;background:#f3faf4;display:flex;flex-direction:column;}
.agent-hdr{background:#fff;padding:10px 16px;
  display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50;
  border-bottom:1px solid #dcefe0;box-shadow:0 2px 12px rgba(31,107,59,.08);}
.agent-status-pill{display:flex;align-items:center;gap:6px;background:#eaf6ed;
  border:1.5px solid #b2d8bb;border-radius:50px;padding:6px 14px;}
.status-dot{width:9px;height:9px;border-radius:50%;background:#1a7a4a;
  box-shadow:0 0 0 2px rgba(26,122,74,.25);animation:pulse 1.5s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.agent-status-text{font-size:11px;font-weight:700;color:#1a3d2b;}
.agent-body{flex:1;padding:16px;display:flex;flex-direction:column;gap:14px;}

/* Scan bar */
.scan-bar{background:#fff;border:1px solid #e6efe6;border-radius:14px;padding:14px;
  box-shadow:0 2px 10px rgba(31,107,59,.06);}
.scan-bar-label{font-size:9px;color:var(--leaf);text-transform:uppercase;letter-spacing:1.5px;font-weight:700;margin-bottom:8px;}
.scan-input-row{display:flex;gap:8px;}
.scan-input{flex:1;background:#f3faf4;border:1.5px solid #dde8dd;
  border-radius:10px;padding:10px 14px;color:var(--forest);font-family:'JetBrains Mono',monospace;
  font-size:13px;font-weight:700;outline:none;}
.scan-input::placeholder{color:#9aa8a0;font-family:'Outfit',sans-serif;font-weight:400;}
.scan-input:focus{border-color:var(--leaf);box-shadow:0 0 0 3px rgba(78,159,61,.12);}
.scan-go{background:var(--forest);color:#fff;border:none;border-radius:10px;padding:10px 18px;
  font-size:13px;font-weight:800;cursor:pointer;font-family:'Outfit',sans-serif;white-space:nowrap;}
.scan-go:disabled{background:#cbd5c9;color:#8a978c;cursor:not-allowed;}

/* Queue sections */
.q-section{border-radius:16px;padding:16px;background:#fff;border:1px solid #eef4ee;
  border-left-width:4px;box-shadow:0 4px 16px rgba(31,107,59,.06);}
.q-section-verify  {border-left-color:#1d4ed8;}
.q-section-pickup  {border-left-color:#7c3aed;}
.q-section-transit {border-left-color:#d97706;}
.q-section-deliver {border-left-color:#2d6a4f;}
.queue-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.queue-label{font-size:11px;color:var(--forest);text-transform:uppercase;letter-spacing:1.2px;font-weight:800;}
.queue-count{background:var(--forest);color:#fff;font-size:11px;font-weight:800;padding:3px 10px;border-radius:50px;}

.delv-card{background:#f8fdf8;border:1px solid #eef4ee;
  border-radius:12px;padding:14px;margin-bottom:10px;}
.delv-card:last-child{margin-bottom:0;}
.delv-code{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;color:var(--leaf);}
.delv-name{font-size:14px;font-weight:700;color:var(--forest);margin-top:3px;}
.delv-addr{font-size:11px;color:var(--gray);margin-top:3px;line-height:1.5;}
.delv-meta{display:flex;align-items:center;gap:10px;margin-top:10px;padding-top:10px;
  border-top:1px solid #eef4ee;}
.delv-pay{font-size:13px;font-weight:800;color:var(--forest);}
.delv-method{font-size:10px;font-weight:700;padding:3px 9px;border-radius:50px;}
.dm-cod{background:#fff7ed;color:#c2620a;}
.dm-upi{background:#e6f7ed;color:#1a7a4a;}
.delv-btn{margin-left:auto;background:var(--forest);color:#fff;border:none;border-radius:50px;
  padding:7px 16px;font-size:11px;font-weight:800;cursor:pointer;font-family:'Outfit',sans-serif;}
.delv-btn:disabled{background:#cbd5c9;color:#8a978c;cursor:not-allowed;}

/* Deliver action sheet */
.deliver-sheet{position:fixed;inset:0;background:#f3faf4;z-index:300;
  display:none;flex-direction:column;overflow-y:auto;}
.deliver-sheet.active{display:flex;}
.deliver-hdr{background:linear-gradient(135deg,#1a3d2b,#2d6a4f);padding:14px 16px;
  display:flex;align-items:center;gap:12px;position:sticky;top:0;}
.deliver-body{padding:18px;flex:1;}

.cod-bar{background:linear-gradient(135deg,#92400e,#d97706);border-radius:14px;
  padding:16px;text-align:center;margin-bottom:16px;}
.cod-amt{font-size:28px;font-weight:800;color:#fff;font-family:'JetBrains Mono',monospace;}
.cod-label{font-size:11px;color:rgba(255,255,255,.8);margin-top:4px;}

.confirm-btn{width:100%;background:linear-gradient(135deg,#1a7a4a,#2d6a4f);color:#fff;
  border:none;border-radius:50px;padding:18px;font-size:16px;font-weight:800;cursor:pointer;
  font-family:'Outfit',sans-serif;box-shadow:0 8px 24px rgba(26,61,43,.4);
  letter-spacing:.5px;transition:all .2s;margin-top:8px;}
.confirm-btn.btn-purple{background:linear-gradient(135deg,#4c1d95,#7c3aed);
  box-shadow:0 8px 24px rgba(76,29,149,.4);}
.confirm-btn.btn-amber{background:linear-gradient(135deg,#78350f,#d97706);
  box-shadow:0 8px 24px rgba(120,53,15,.4);}
.confirm-btn.btn-blue{background:linear-gradient(135deg,#1e3a5f,#1d4ed8);
  box-shadow:0 8px 24px rgba(29,78,216,.4);}
.confirm-btn:disabled{background:#cbd5c9;color:#8a978c;cursor:not-allowed;box-shadow:none;}

/* Route toggle */
.route-toggle{display:flex;gap:8px;margin-bottom:14px;}
.route-btn{flex:1;background:#fff;border:1.5px solid #dde8dd;
  border-radius:10px;padding:10px;text-align:center;cursor:pointer;color:var(--gray);
  font-size:12px;font-weight:700;font-family:'Outfit',sans-serif;transition:all .15s;}
.route-btn.on{background:#f0f9ec;border-color:var(--leaf);color:var(--forest);box-shadow:inset 0 0 0 1px var(--leaf);}

/* Stats */
.agent-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.astat{background:#fff;border:1px solid #eef4ee;
  border-radius:12px;padding:12px;text-align:center;box-shadow:0 2px 10px rgba(31,107,59,.05);}
.astat-val{font-size:20px;font-weight:800;color:var(--forest);font-family:'JetBrains Mono',monospace;}
.astat-lbl{font-size:9px;color:var(--gray);text-transform:uppercase;letter-spacing:1px;margin-top:4px;font-weight:700;}

.done-card{background:#fff;border:1px solid #eef4ee;
  border-radius:10px;padding:12px;margin-bottom:8px;display:flex;align-items:center;gap:12px;
  box-shadow:0 2px 8px rgba(31,107,59,.05);}
</style>
</head>
<body class="agent-bg">
<div id="toast" class="toast"></div>

<!-- HEADER -->
<div class="agent-hdr">
  <a href="home.html" class="hbrand">
    <div class="hring"><img src="img/logo-sm.jpg" alt="MA"></div>

<!-- BODY -->
<div class="agent-body">

  <!-- Agent identity + clock -->
  <div style="display:flex;justify-content:space-between;align-items:center;">
    <div>
      <div style="font-size:18px;font-weight:800;color:var(--forest)" id="agentName">Agent</div>
      <div style="font-size:11px;color:var(--gray)" id="agentSub">—</div>
    </div>
    <div style="text-align:right">
      <div class="liveclk" id="liveClock">--</div>
      <div style="font-size:10px;color:var(--gray);margin-top:3px">IST</div>

  <div class="agent-stats">

  <div class="scan-bar">

    <div style="color:var(--forest);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:10px;">

</div>

<!-- DELIVER ACTION SHEET -->
<div class="deliver-sheet" id="deliverSheet">
  <div class="deliver-hdr">
    <button class="overlay-back" onclick="closeSheet()">←</button>
    <div class="overlay-title" id="sheetTitle">Order Details</div>

</div>

<!-- PROFILE SHEET -->
<div class="deliver-sheet" id="profileSheet">

    <button class="overlay-back" onclick="closeAgentProfile()">←</button>

      <div style="margin-top:12px;display:flex;flex-direction:column;gap:6px">
        <div style="display:flex;justify-content:space-between;font-size:12px">
          <span style="color:var(--gray)">Login ID</span><span class="mono" style="color:var(--forest);font-weight:700" id="prof-lid">—</span>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:12px">
          <span style="color:var(--gray)">Phone</span><span class="mono" style="color:var(--forest)" id="prof-phone">—</span>

    <div style="background:#fff;border:1px solid #eef4ee;border-radius:14px;padding:16px">

  </div>

<script src="js/config.js"></script>
<script src="js/shared.js"></script>
<script src="js/api.js"></script>
<script>
var user = requireAuth('agent');
if (!user) throw new Error('redirect');

startClock('liveClock');
document.getElementById('agentName').textContent = user.fname + (user.lname ? ' ' + user.lname : '');
document.getElementById('agentSub').textContent  =
  _isVCO
    ? 'VCO · ' + (user.vco_city || user.village_town || user.district || '—')
    : 'Delivery Agent · ' + (user.district || '—');

var _toVerify  = [];   // Packaged — VCO to verify
var _toPickUp  = [];   // VCO Verified — agent to pick up
var _inTransit = [];   // Picked Up — agent to advance to Out for Delivery
var _toDeliver = [];   // Out for Delivery — agent to deliver
var _delivered = [];   // Delivered today

var _isVCO = (user.admin_role === 'VCO');

// Relabel stats for VCOs
if (_isVCO) {
  document.getElementById('lbl-queue').textContent     = 'To Verify';
  document.getElementById('lbl-delivered').textContent = 'Verified';
  document.getElementById('lbl-cod').textContent       = 'In Pipeline';
}

// ── Load orders ───────────────────────────────────────────────────────────────
async function loadOrders() {
  try {
    var res    = await API.getOrders();
    var orders = res.orders || [];
    _toVerify  = orders.filter(function(o){ return o.status === 'Packaged'         && !o.cancelled; });
    _toPickUp  = orders.filter(function(o){ return o.status === 'VCO Verified'     && !o.cancelled; });
    _inTransit = orders.filter(function(o){ return o.status === 'Picked Up'        && !o.cancelled; });
    _toDeliver = orders.filter(function(o){ return o.status === 'Out for Delivery' && !o.cancelled; });
    _delivered = orders.filter(function(o){ return o.status === 'Delivered'; });
    renderStats();
    renderQueueSections();
    renderDelivered();
  } catch(e) {
    document.getElementById('queueSections').innerHTML =
      '<div style="text-align:center;padding:20px;color:var(--gray)">' + e.message + '</div>';
  }
}

function renderStats() {
  var queueTotal = (_isVCO ? _toVerify.length : 0) + _toPickUp.length + _inTransit.length + _toDeliver.length;
  document.getElementById('s-queue').textContent     = queueTotal;
  document.getElementById('s-delivered').textContent = _isVCO ? _toPickUp.length + _inTransit.length + _toDeliver.length : _delivered.length;
  if (_isVCO) {
    // "In Pipeline" = all orders beyond VCO Verified stage in their village
    document.getElementById('s-cod').textContent = _toPickUp.length + _inTransit.length + _toDeliver.length + _delivered.length;
  } else {
    var cod = _delivered.reduce(function(s, o) {
      return s + (o.pay_method === 'Cash on Delivery' ? parseFloat(o.total || 0) : 0);
    }, 0);
    document.getElementById('s-cod').textContent = '₹' + cod.toFixed(0);
  }
}

// ── Queue sections ────────────────────────────────────────────────────────────
function renderQueueSections() {
  var html = '';

  if (_isVCO && _toVerify.length > 0) {
    html += queueSection('📋 Verify Packaged Orders', _toVerify, 'verify', 'q-section-verify', '✓ Verify');
  }

  if (_toPickUp.length > 0) {
    html += queueSection('📦 Pick Up', _toPickUp, 'pickup', 'q-section-pickup', '⬆ Pick Up');
  }

  if (_inTransit.length > 0) {
    html += queueSection('🚚 In Transit', _inTransit, 'transit', 'q-section-transit', '→ Out for Delivery');
  }

  if (_toDeliver.length > 0) {
    html += queueSection('🛵 Deliver', _toDeliver, 'deliver', 'q-section-deliver', 'Deliver →');
  }

  if (!html) {
    html = '<div style="text-align:center;padding:32px;color:var(--gray);font-size:13px">' +
           '<div style="font-size:40px;margin-bottom:12px">🎉</div>All clear — nothing pending!</div>';
  }

  document.getElementById('queueSections').innerHTML = html;
}

function queueSection(title, orders, action, sectionClass, btnLabel) {
  var html = '<div class="q-section ' + sectionClass + '" style="margin-bottom:14px">';
  html += '<div class="queue-head"><div class="queue-label">' + title + '</div>';
  html += '<div class="queue-count">' + orders.length + '</div></div>';
  orders.forEach(function(o) {
    var mClass = o.pay_method === 'Cash on Delivery' ? 'dm-cod' : 'dm-upi';
    html += '<div class="delv-card">';
    html += '<div class="delv-code">' + (o.code || o.id.slice(0,8).toUpperCase()) + '</div>';
    html += '<div class="delv-name">' + (o.consumer_name || 'Consumer') + '</div>';
    if (o.delivery_address) html += '<div class="delv-addr">' + o.delivery_address + '</div>';
    html += '<div class="delv-meta">';
    html += '<div class="delv-pay">' + fmt(o.total) + '</div>';
    html += '<span class="delv-method ' + mClass + '">' + (o.pay_method || 'UPI') + '</span>';
    if (action === 'deliver') {
      html += '<button class="delv-btn" onclick="openDeliverSheet(\'' + o.id + '\')">' + btnLabel + '</button>';
    } else {
      html += '<button class="delv-btn" id="btn-' + o.id + '" onclick="quickScan(\'' + o.id + '\',\'' + action + '\',this)">' + btnLabel + '</button>';
    }
    html += '</div></div>';
  });
  html += '</div>';
  return html;
}

// ── Quick scan (for verify / pickup / transit) ────────────────────────────────
async function quickScan(orderId, action, btn) {
  btn.disabled = true;
  btn.textContent = '⏳…';
  try {
    var res = await API.scanOrder(orderId);
    showToast(res.message || ('Advanced to: ' + res.newStatus), 'ok');
    await loadOrders();
  } catch(e) {
    showToast(e.message, 'er');
    btn.disabled = false;
    btn.textContent = action === 'verify' ? '✓ Verify' : action === 'pickup' ? '⬆ Pick Up' : '→ Out for Delivery';
  }
}

// ── Scan bar ──────────────────────────────────────────────────────────────────
async function scanFromBar() {
  var code = document.getElementById('scanInput').value.trim();
  if (!code) { showToast('Enter an order code', 'er'); return; }
  var btn = document.getElementById('scanGoBtn');
  btn.disabled = true; btn.textContent = '⏳';
  try {
    var res = await API.scanOrder(code);
    showToast(res.message || ('Advanced to: ' + res.newStatus), 'ok');
    document.getElementById('scanInput').value = '';
    await loadOrders();
  } catch(e) {
    showToast(e.message, 'er');
  } finally {
    btn.disabled = false; btn.textContent = '→ Go';
  }
}

// ── Deliver sheet (full details for Out for Delivery) ─────────────────────────
async function openDeliverSheet(orderId) {
  document.getElementById('deliverSheet').classList.add('active');
  document.getElementById('sheetContent').innerHTML = '<div class="spinner"><div class="spin"></div></div>';
  try {
    var res   = await API.getOrder(orderId);
    var o     = res.order;
    var items = res.items || [];
    document.getElementById('sheetTitle').textContent = o.code || 'Deliver Order';

    var html = '';

    // COD collect bar
    if (o.pay_method === 'Cash on Delivery') {
      html += '<div class="cod-bar">';
      html += '<div class="cod-label">Collect Cash on Delivery</div>';
      html += '<div class="cod-amt">' + fmt(o.total) + '</div>';
      html += '<div style="font-size:11px;color:rgba(255,255,255,.7);margin-top:6px">Collect before handing over</div>';
      html += '</div>';
    }

    // Address + call
    var da = o.delivery_address;
    var daText = (da && typeof da === 'object') ? buildAddress(da) : (da || '');
    html += '<div class="card" style="margin-bottom:14px"><h3>📍 Delivery Address</h3>';
    html += '<div style="font-size:12px;font-weight:700;color:var(--forest);margin-bottom:3px">' + (o.consumer_name || 'Consumer') + (da && da.label ? ' · ' + da.label : '') + '</div>';
    html += '<div style="font-size:13px;line-height:1.7;color:var(--forest)">' + (daText || '—') + '</div>';
    var callPhone = (da && da.phone) || o.consumer_phone;
    if (callPhone) {
      html += '<a href="tel:' + callPhone + '" style="display:inline-block;margin-top:10px;background:var(--greenbg);color:var(--green);padding:8px 18px;border-radius:50px;font-size:12px;font-weight:700;text-decoration:none">📞 Call Customer</a>';
    }
    html += '</div>';

    // Items
    html += '<div class="card" style="margin-bottom:14px"><h3>🌿 Items to Hand Over</h3>';
    items.forEach(function(item) {
      html += '<div class="irow"><span class="ilbl">' + item.name + '</span><span class="ival">' + item.qty + ' ' + item.unit + '</span></div>';
    });
    html += '</div>';

    // Route selector
    var currentRoute = o.route || 'direct';
    html += '<div class="card" style="margin-bottom:14px"><h3>🗺 Route</h3>';
    html += '<div class="route-toggle">';
    html += '<div class="route-btn' + (currentRoute === 'direct' ? ' on' : '') + '" id="route-direct" onclick="setRoute(\'' + o.id + '\',\'direct\')">🛵 Direct<br><span style="font-size:9px;font-weight:400">~2 hrs ETA</span></div>';
    html += '<div class="route-btn' + (currentRoute === 'hub' ? ' on' : '') + '" id="route-hub" onclick="setRoute(\'' + o.id + '\',\'hub\')">🏭 Via Hub<br><span style="font-size:9px;font-weight:400">~4 hrs ETA</span></div>';
    html += '</div>';
    if (o.eta_ts) html += '<div style="font-size:10px;color:var(--gray)">ETA: ' + fmtDate(o.eta_ts) + '</div>';
    html += '</div>';

    // Order summary
    html += '<div class="card" style="margin-bottom:20px"><h3>💳 Payment</h3>';
    html += '<div class="irow"><span class="ilbl">Method</span><span class="ival">' + (o.pay_method || '—') + '</span></div>';
    html += '<div class="irow"><span class="ilbl">Status</span><span class="ival" style="color:' + (o.pay_status === 'paid' ? 'var(--green)' : '#f4a261') + '">' + (o.pay_status || '—') + '</span></div>';
    html += '<div class="irow"><span class="ilbl">Total</span><span class="ival" style="font-size:15px;font-weight:800;color:var(--forest)">' + fmt(o.total) + '</span></div>';
    html += '</div>';

    var btnLabel = o.pay_method === 'Cash on Delivery'
      ? '✅ Confirm Cash Collected & Delivered'
      : '✅ Confirm Delivered';
    html += '<button class="confirm-btn" id="confirmBtn" onclick="confirmDelivery(\'' + o.id + '\')">' + btnLabel + '</button>';

    document.getElementById('sheetContent').innerHTML = html;
  } catch(e) {
    document.getElementById('sheetContent').innerHTML =
      '<div class="empty-state"><p>' + e.message + '</p></div>';
  }
}

async function setRoute(orderId, route) {
  try {
    await apiFetch('PATCH', '/orders/' + orderId + '/route', { route: route }, getToken());
    document.getElementById('route-direct').classList.toggle('on', route === 'direct');
    document.getElementById('route-hub').classList.toggle('on', route === 'hub');
    showToast('Route set to ' + route, 'ok');
  } catch(e) { showToast(e.message, 'er'); }
}

function closeSheet() {
  document.getElementById('deliverSheet').classList.remove('active');
}

async function confirmDelivery(orderId) {
  var btn = document.getElementById('confirmBtn');
  btn.disabled = true; btn.textContent = 'Confirming…';
  try {
    await API.scanOrder(orderId);
    closeSheet();
    showToast('Order delivered! 🎉', 'ok');
    await loadOrders();
  } catch(e) {
    showToast(e.message, 'er');
    btn.disabled = false;
    btn.textContent = '✅ Confirm Delivered';
  }
}

// ── Delivered list ────────────────────────────────────────────────────────────
function renderDelivered() {
  var sec = document.getElementById('deliveredSection');
  if (_delivered.length === 0) { sec.style.display = 'none'; return; }
  sec.style.display = 'block';
  var html = '';
  _delivered.forEach(function(o) {
    var mClass = o.pay_method === 'Cash on Delivery' ? 'dm-cod' : 'dm-upi';
    html += '<div class="done-card">';
    html += '<div style="font-size:18px">✅</div>';
    html += '<div style="flex:1">';
    html += '<div style="font-family:\'JetBrains Mono\',monospace;font-size:12px;color:var(--leaf)">' + (o.code || o.id.slice(0,8).toUpperCase()) + '</div>';
    html += '<div style="font-size:12px;color:var(--gray)">' + (o.consumer_name || 'Consumer') + '</div>';
    html += '</div>';
    html += '<div style="text-align:right">';
    html += '<div style="font-weight:800;color:var(--forest)">' + fmt(o.total) + '</div>';
    html += '<span class="delv-method ' + mClass + '" style="margin-top:3px;display:inline-block">' + (o.pay_method === 'Cash on Delivery' ? 'COD' : 'UPI') + '</span>';
    html += '</div></div>';
  });
  document.getElementById('deliveredList').innerHTML = html;
}

// ── Agent profile ─────────────────────────────────────────────────────────────
function openAgentProfile() {
  document.getElementById('prof-name').textContent     = user.fname + (user.lname ? ' ' + user.lname : '');
  document.getElementById('prof-role').textContent     = (user.admin_role || 'Delivery Agent') + ' · ' + (user.district || '—');
  document.getElementById('prof-lid').textContent      = user.login_id || '—';
  document.getElementById('prof-phone').textContent    = (user.country_code || '+91') + ' ' + user.phone;
  document.getElementById('prof-district').textContent   = user.district || '—';
  document.getElementById('prof-gender').textContent     = user.gender || '—';
  document.getElementById('prof-gender-select').value    = user.gender || '';
  document.getElementById('prof-vehicle').value          = user.agent_vehicle || '';
  document.getElementById('prof-cpw').value            = '';
  document.getElementById('prof-npw').value            = '';
  document.getElementById('prof-pw-err').style.display = 'none';
  document.getElementById('profileSheet').classList.add('active');
}

function closeAgentProfile() {
  document.getElementById('profileSheet').classList.remove('active');
}

async function saveVehicle() {
  var v = document.getElementById('prof-vehicle').value.trim();
  try {
    var res = await API.patchMe({ agent_vehicle: v || '' });
    user = res.user;
    setSession(getToken(), user);
    document.getElementById('agentSub').textContent = (user.admin_role || 'Delivery Agent') + ' · ' + (user.district || '—');
    showToast('Vehicle info saved.', 'ok');
  } catch(e) { showToast(e.message, 'er'); }
}

async function saveGender() {
  var g = document.getElementById('prof-gender-select').value;
  if (!g) { showToast('Please select a gender.', 'er'); return; }
  try {
    var res = await API.patchMe({ gender: g });
    user = res.user;
    setSession(getToken(), user);
    document.getElementById('prof-gender').textContent = user.gender || '—';
    showToast('Gender saved.', 'ok');
  } catch(e) { showToast(e.message, 'er'); }
}

async function agentChangePw() {
  var cur = document.getElementById('prof-cpw').value;
  var nw  = document.getElementById('prof-npw').value;
  var err = document.getElementById('prof-pw-err');
  err.style.display = 'none';
  if (!cur) { err.textContent = 'Enter your current password.'; err.style.display = 'block'; return; }
  if (nw.length < 6) { err.textContent = 'New password must be at least 6 characters.'; err.style.display = 'block'; return; }
  try {
    await API.changePassword(cur, nw);
    document.getElementById('prof-cpw').value = '';
    document.getElementById('prof-npw').value = '';
    showToast('Password changed.', 'ok');
  } catch(e) {
    err.textContent = e.message;
    err.style.display = 'block';
  }
}

// ── Init + auto-refresh ───────────────────────────────────────────────────────
loadOrders();
setInterval(loadOrders, 60000);
</script>
</body>
</html>
